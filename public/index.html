<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedConnect Client Acquisition</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* MedConnect brand (from medconnectstaffing.com): ink #0F1115, mist #F0F2F4, white cards, MedConnect cyan #1AB7EA.
     Layout: dark brand sidebar with the logo on a white chip, light working area, rounded white cards, pill buttons. */
  --bg:#f0f2f4; --surface:#ffffff; --sunk:#f5f6f8; --ink:#0f1115; --muted:#5c6370; --line:#dde0e5;
  --accent:#1ab7ea; --accent-strong:#0e9fd0; --accent-ink:#ffffff; --accent-soft:#e3f6fd;
  --brand-blue:#0097d7; --sidebar:#0f1115; --sidebar-2:#1f2329; --sidebar-ink:#f0f2f4; --sidebar-muted:#9aa1ad;
  --good:#16a34a; --good-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --bad:#dc2626; --bad-soft:#fee2e2;
  --pm:#6d28d9; --pm-soft:#ede9fe; --lu:#0e9fd0; --lu-soft:#e3f6fd;
  --display:"Plus Jakarta Sans",Inter,system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:17px} h3{font-size:15px}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
a{color:var(--brand-blue)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.rail{background:var(--sidebar);color:var(--sidebar-ink);padding:18px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:8px}
.brand .chip{background:#fff;border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;justify-content:center}
.brand img{width:100%;max-width:190px;height:auto;display:block}
.brand span{color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:0 4px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--sidebar-ink);font-weight:500}
.nav a:hover{background:var(--sidebar-2)}
.nav a[aria-current="page"]{background:var(--accent);color:#fff}
.nav .count{font-size:12px;font-variant-numeric:tabular-nums;background:var(--sidebar-2);color:var(--sidebar-ink);border-radius:999px;padding:0 8px;min-width:24px;text-align:center}
.nav a[aria-current="page"] .count{background:rgba(255,255,255,.22);color:#fff}
.clock{margin-top:auto;border-top:1px solid var(--sidebar-2);padding:14px 4px 0;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--sidebar-muted)}
.clock strong{color:#fff;font-size:15px}
.clock .btn{background:transparent;border-color:var(--sidebar-2);color:var(--sidebar-ink)}
.clock .btn:hover{border-color:var(--accent)}

main{padding:24px 30px 60px;display:flex;flex-direction:column;gap:20px;min-width:0}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border:1px solid #fde68a;border-radius:var(--radius);padding:10px 14px;font-size:13px}
.banner b{color:var(--warn)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.head .eyebrow{display:block;color:var(--accent);font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
.head.hero{background:var(--sidebar);color:#fff;border-radius:20px;padding:26px 28px;align-items:center;position:relative;overflow:hidden}
.head.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(26,183,234,.35),rgba(26,183,234,0) 70%);pointer-events:none}
.head.hero p{color:#c9ced6}
.head.hero h1{font-size:30px}
.head.hero .btn{background:transparent;color:#fff;border-color:#3a404a}
.head.hero .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,17,21,.04)}
.card > .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card > .cb{padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 2px rgba(15,17,21,.04)}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .s{font-size:12px;color:var(--muted)}

.pipe{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.pipe div{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.pipe div:last-child{border-right:0}
.pipe small{color:var(--accent);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em}
.pipe b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.pipe span{font-size:12px;color:var(--muted)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
td .sub{color:var(--muted);font-size:12.5px}
.empty{padding:24px 18px;color:var(--muted);text-align:center}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--accent-soft);color:var(--accent-strong)}
.p-mute{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.src{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;border-radius:6px;padding:1px 6px;margin-right:3px}
.src.pm{background:var(--pm-soft);color:var(--pm)}
.src.lu{background:var(--lu-soft);color:var(--lu)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:13px}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:5px}
.reasons{margin:4px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.reasons li::before{content:"· "}

.runlog{display:flex;flex-direction:column;gap:9px;font-size:13px}
.runlog .row{display:grid;grid-template-columns:90px 1fr;gap:10px}
.runlog .t{color:var(--muted);font-family:var(--mono);font-size:12px;padding-top:1px}

.scrim{position:fixed;inset:0;background:rgba(15,17,21,.45);z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:11;overflow-y:auto;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(15,17,21,.18)}
.drawer .dh{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:sticky;top:0;background:var(--surface);z-index:1}
.drawer .ds{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.contact{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.contact.sel{border-color:var(--accent);background:var(--accent-soft)}
.email{border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:14px 16px;font-size:13.5px;white-space:pre-wrap}
.email .subj{font-weight:600;margin-bottom:8px;white-space:normal}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.timeline li{display:grid;grid-template-columns:86px 1fr;gap:8px}
.timeline .t{color:var(--muted);font-family:var(--mono);font-size:12px}
.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:13px}
.field .hint{color:var(--muted);font-size:12px}
input[type=text],input[type=number],textarea,select{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--surface);width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:110px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;background:var(--surface)}
.switch{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius)}
.switch input{margin-top:3px;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.switch small{display:block;color:var(--muted);font-size:12px}

.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:20;max-width:90%;box-shadow:0 8px 24px rgba(15,17,21,.25)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto}
  .nav{flex-direction:row;flex-wrap:wrap}
  .clock{margin-top:0}
  main{padding:16px}
  .pipe{grid-template-columns:repeat(3,1fr)}
  .pipe div:nth-child(3){border-right:0}
  .pipe div:nth-child(-n+3){border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.clock .btn{display:block;text-align:center}
details summary{list-style:revert}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="chip"><img src="/logo.png" alt="MedConnect, a healthcare staffing company" width="190" height="38"></div><span>Client Acquisition</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="clock" id="clock"></div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<div id="drawerRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TZ = "America/New_York";
const fmtDay = (d) => d ? new Date(d).toLocaleDateString("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric" }) : "—";
const fmtShort = (d) => d ? new Date(d).toLocaleDateString("en-US", { timeZone: TZ, month: "short", day: "numeric" }) : "—";
const fmtTime = (d) => d ? new Date(d).toLocaleString("en-US", { timeZone: TZ, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—";
const VIEWS = [["today", "Today's Opportunities"], ["queue", "Prospect Queue"], ["outreach", "Outreach Activity"], ["responses", "Response Queue"], ["performance", "Performance"], ["settings", "Settings"]];
const CAT_LABEL = { interested: "Interested", not_now: "Not right now", referral: "Referral", wrong_contact: "Wrong contact", opt_out: "Opt-out", ooo: "Out of office", bounce: "Bounced", other: "Other reply" };
const CAT_PILL = { interested: "p-good", referral: "p-info", not_now: "p-mute", wrong_contact: "p-warn", opt_out: "p-bad", ooo: "p-mute", bounce: "p-bad", other: "p-mute" };
let ui = { queueTab: "review", drawer: null, tpl: "initial_opening", overview: null, settingsData: null };

async function api(path, opts = {}) {
  const res = await fetch(path, { method: opts.method || "GET", headers: opts.body ? { "Content-Type": "application/json" } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: "same-origin" });
  const json = await res.json().catch(() => ({}));
  if (res.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}
function toast(t, bad) { const r = document.getElementById("toastRoot"); r.innerHTML = `<div class="toast" role="status"${bad ? ' style="background:var(--bad)"' : ""}>${esc(t)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => (r.innerHTML = ""), 4200); }
function view() { const h = location.hash.slice(1).split("?")[0]; return VIEWS.some((v) => v[0] === h) ? h : "today"; }
const srcChips = (s) => (s || []).map((x) => x === "PM" ? '<span class="src pm" title="PracticeMatch">PM</span>' : x === "Lusha" ? '<span class="src lu" title="Lusha">LUSHA</span>' : `<span class="src" style="background:var(--sunk);color:var(--muted)">${esc(x.toUpperCase())}</span>`).join("");

function statusPill(e) {
  const s = e.sequence;
  if (e.bucket === "outreach" && s) {
    if (s.replied) return '<span class="pill p-good">Replied</span>';
    if (s.status === "active") return `<span class="pill p-info">In sequence · step ${s.step + 1}/3</span>`;
    if (s.status === "paused") return '<span class="pill p-warn">Paused</span>';
    if (s.status === "completed") return '<span class="pill p-mute">Sequence finished</span>';
    return '<span class="pill p-mute">Stopped</span>';
  }
  if (e.bucket === "suppressed") return e.status === "protected" ? '<span class="pill p-bad">Protected client</span>' : e.status === "excluded" ? '<span class="pill p-bad">Excluded</span>' : '<span class="pill p-bad">Suppressed</span>';
  return { ready: '<span class="pill p-good">Ready</span>', review: '<span class="pill p-warn">Review</span>', contact: '<span class="pill p-warn">Needs contact</span>' }[e.bucket] || "";
}
function signalCell(e) {
  if (!e.openingCount) return '<span class="sub">No active listing · Lusha prospect</span>';
  const o = e.openings[0];
  return `${esc(o.specialty)} ${esc(o.role)}${e.openingCount > 1 ? ` <span class="sub">+${e.openingCount - 1} more</span>` : ""}<div class="sub">Posted ${fmtShort(o.postedAt)}</div>`;
}
function rowActions(e) {
  const b = e.bucket;
  if (b === "review") return `<div class="actions"><button class="btn sm primary" data-emp="${e.id}" data-a="approve">Approve</button><button class="btn sm" data-emp="${e.id}" data-a="suppress">Suppress</button></div>`;
  if (b === "ready") return `<button class="btn sm primary" data-emp="${e.id}" data-a="enroll">Enroll</button>`;
  if (b === "contact") return `<button class="btn sm" data-emp="${e.id}" data-a="enrich">Find via Lusha</button>`;
  if (b === "suppressed" && e.decision === "suppressed") return `<button class="btn sm" data-emp="${e.id}" data-a="unsuppress">Restore</button>`;
  if (b === "outreach" && e.sequence?.status === "active") return `<button class="btn sm" data-emp="${e.id}" data-a="pause">Pause</button>`;
  if (b === "outreach" && e.sequence?.status === "paused") return `<button class="btn sm" data-emp="${e.id}" data-a="resume">Resume</button>`;
  if (b === "outreach" && e.sequence && ["stopped", "completed"].includes(e.sequence.status) && !e.sequence.replied) return `<button class="btn sm" data-emp="${e.id}" data-a="recontact">Try again</button>`;
  return "";
}
function modeBanner(m) {
  if (!m) return "";
  if (m.dryRun) return '<div class="banner"><b>Dry run</b><span>Emails are composed and logged, never sent. When the supervised review looks right, set DRY_RUN=false in Railway to go live.</span></div>';
  if (m.paused) return '<div class="banner"><b>Paused</b><span>Automation is paused. Discovery keeps running; nothing is sent. Turn it back on in Settings.</span></div>';
  return "";
}

/* ---------------- nav ---------------- */
async function renderNav() {
  const o = ui.overview;
  const v = view();
  const c = o?.counts || {};
  const badge = o ? { today: o.fresh.length, queue: (c.ready || 0) + (c.review || 0) + (c.contact || 0), outreach: o.send.due, responses: o.totals.unhandled } : {};
  document.getElementById("nav").innerHTML = VIEWS.map(([k, l]) => `<a href="#${k}"${v === k ? ' aria-current="page"' : ""}><span>${l}</span>${badge[k] !== undefined ? `<span class="count">${badge[k]}</span>` : ""}</a>`).join("");
  if (!o) return;
  const s = o.send;
  document.getElementById("clock").innerHTML = `<span>${fmtTime(o.now)} ET</span>
    <span>${o.mode.paused ? '<span class="pill p-bad">Paused</span>' : o.mode.dryRun ? '<span class="pill p-warn">Dry run</span>' : o.mode.supervised ? '<span class="pill p-warn">Supervised</span>' : '<span class="pill p-good">Automated</span>'}</span>
    <span><strong>${s.sent}</strong> of ${s.cap} sent today</span>
    <span>${s.canSend ? "Sending is open" : esc(s.reason)}</span>
    <a class="btn sm" href="/logout" style="text-decoration:none">Sign out</a>`;
}

/* ---------------- today ---------------- */
async function renderToday() {
  const o = ui.overview;
  const c = o.counts; const run = o.lastRun; const sm = run?.summary || {};
  const stages = [["Discover", o.totals.employers, "employers on file"], ["Extract", o.totals.contacts, "contacts captured"], ["Qualify", (c.ready || 0) + (c.review || 0) + (c.contact || 0), "awaiting a decision"], ["Protect", c.suppressed || 0, "blocked or excluded"], ["Engage", o.totals.active, "in active sequences"], ["Track", o.totals.replies, "replies to date"]];
  return modeBanner(o.mode) + `<div class="head hero"><div style="position:relative;z-index:1"><span class="eyebrow">Connecting people · Improving healthcare</span><h1>Today's Opportunities</h1><p>${fmtDay(o.now)}. New employers and fresh hiring signals from PracticeMatch and Lusha.</p></div>
  <div class="actions"><button class="btn" data-act="pmScan">Scan PracticeMatch now</button><button class="btn" data-act="runDiscovery">Run full discovery</button><button class="btn primary" data-act="sendNow" ${o.send.due && o.send.canSend ? "" : "disabled"} title="${esc(o.send.reason || "")}">Send next email now</button></div></div>
  <div class="pipe">${stages.map((s) => `<div><small>${s[0]}</small><b>${s[1]}</b><span>${s[2]}</span></div>`).join("")}</div>
  <div class="kpis">
    <div class="kpi"><span class="l">New or refreshed employers</span><span class="v">${o.fresh.length}</span><span class="s">since midnight ET</span></div>
    <div class="kpi"><span class="l">Waiting on your review</span><span class="v">${c.review || 0}</span><span class="s">${c.contact || 0} more need a contact</span></div>
    <div class="kpi"><span class="l">Emails due</span><span class="v">${o.send.due}</span><span class="s">${o.send.sent} sent of ${o.send.cap} today</span></div>
    <div class="kpi"><span class="l">Replies to handle</span><span class="v">${o.totals.unhandled}</span><span class="s">${o.totals.tasks} open follow-up tasks</span></div>
  </div>
  <div class="grid2">

/* ---------------- performance ---------------- */
async function renderPerformance() {
  const d = await api("/api/performance");
  const k = d.kpis; const days = d.daily.map((x) => ({ day: x.day, sent: Number(x.sent), rep: Number(x.replies) }));
  const max = Math.max(5, ...days.map((x) => x.sent)); const top = Math.ceil(max / 10) * 10;
  const W = 640, H = 200, pl = 32, pb = 24, pt = 10, bw = (W - pl - 8) / days.length; const y = (v) => pt + (H - pt - pb) * (1 - v / top);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Emails sent and replies per day, last 14 days">`;
  for (let g = 0; g <= top; g += top / 2) svg += `<line x1="${pl}" x2="${W - 8}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(g) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${g}</text>`;
  days.forEach((x, i) => { const X = pl + i * bw + bw * 0.15, w = bw * 0.7; const lab = new Date(x.day + (String(x.day).length <= 10 ? "T12:00:00Z" : "")).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
    svg += `<rect x="${X}" y="${y(x.sent)}" width="${w}" height="${H - pb - y(x.sent)}" rx="2" fill="var(--accent)" opacity="${i === days.length - 1 ? 1 : 0.55}"><title>${lab}: ${x.sent} sent</title></rect>`;
    if (x.rep) svg += `<rect x="${X + w * 0.25}" y="${y(x.rep)}" width="${w * 0.5}" height="${H - pb - y(x.rep)}" rx="2" fill="var(--good)"><title>${lab}: ${x.rep} replies</title></rect>`;
    if (i % 2 === 1 || i === days.length - 1) svg += `<text x="${X + w / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab}</text>`; });
  svg += "</svg>";
  return `<div class="head"><div><h1>Performance</h1><p>The proposal's success measures, split by where each employer came from.</p></div></div>
  <div class="kpis">
    <div class="kpi"><span class="l">Qualified employers discovered</span><span class="v">${k.qualified}</span><span class="s">${k.blocked} blocked or excluded</span></div>
    <div class="kpi"><span class="l">Unique employers contacted</span><span class="v">${k.contacted}</span><span class="s">${k.sent} emails sent</span></div>
    <div class="kpi"><span class="l">Usable contacts</span><span class="v">${k.usable_contacts}</span><span class="s">${k.bounces} bounced</span></div>
    <div class="kpi"><span class="l">Human replies</span><span class="v">${k.human_replies}</span><span class="s">${k.positive} positive</span></div>
    <div class="kpi"><span class="l">Meetings booked</span><span class="v">${k.meetings}</span><span class="s">marked from replies</span></div>
    <div class="kpi"><span class="l">Lusha credits</span><span class="v">${d.credits.month}</span><span class="s">${d.credits.today} today</span></div>
  </div>
  <section class="card chart"><div class="ch"><h2>Daily outreach, last 14 days</h2><div class="legend"><span><i style="background:var(--accent)"></i>Emails sent</span><span><i style="background:var(--good)"></i>Replies</span></div></div><div class="cb">${svg}</div></section>
  <section class="card"><div class="ch"><h2>By source</h2></div><div class="tablewrap"><table><thead><tr><th>Source</th><th>Employers</th><th>Contacted</th><th>Replied</th><th>Positive</th><th>Reply rate</th></tr></thead><tbody>${d.bySource.map((r) => `<tr><td><b>${esc(r.src)}</b></td><td class="n">${r.employers}</td><td class="n">${r.contacted}</td><td class="n">${r.replied}</td><td class="n">${r.positive}</td><td class="n">${Number(r.contacted) ? Math.round((Number(r.replied) / Number(r.contacted)) * 100) + "%" : "—"}</td></tr>`).join("")}</tbody></table></div></section>`;
}

/* ---------------- render loop ---------------- */
async function renderAll() {
  try {
    ui.overview = await api("/api/overview");
    await renderNav();
    const v = view();
    const html = await ({ today: renderToday, queue: renderQueue, outreach: renderOutreach, responses: renderResponses, performance: renderPerformance, settings: renderSettings })[v]();
    const m = document.getElementById("main");
    const focusId = document.activeElement?.id; const pos = document.activeElement?.selectionStart;
    m.innerHTML = html;
    if (focusId === "qsearch") { const el = document.getElementById("qsearch"); el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
    if (v === "settings") await fillBookmarklet();
    await renderDrawer();
  } catch (e) { toast(e.message, true); }
}
async function act(promise, okMsg) {
  try { const r = await promise; toast(r?.message || okMsg || "Done"); await renderAll(); return r; }
  catch (e) { toast(e.message, true); }
}

function setPath(obj, path, val) { const ks = path.split("."); const out = {}; let cur = out; ks.forEach((k, i) => { if (i === ks.length - 1) cur[k] = val; else cur = cur[k] = {}; }); return out; }
let saveTimer = null;
async function saveSetting(patch, quiet) {
  try { await api("/api/settings", { method: "PUT", body: patch }); if (!quiet) toast("Saved"); ui.overview = await api("/api/overview"); renderNav(); }
  catch (e) { toast(e.message, true); }
}

document.addEventListener("click", async (ev) => {
  const t = ev.target;
  const tab = t.closest("[data-tab]"); if (tab) { ui.queueTab = tab.dataset.tab; return renderAll(); }

  const emp = t.closest("[data-emp][data-a]");
  if (emp) {
    ev.stopPropagation();
    const a = emp.dataset.a; const body = { action: a };
    if (a === "note") body.text = document.getElementById("note-in").value;
    if (a === "addContact") Object.assign(body, { name: document.getElementById("nc-name").value, title: document.getElementById("nc-title").value, email: document.getElementById("nc-email").value });
    emp.disabled = true;
    return act(api(`/api/employers/${emp.dataset.emp}/action`, { method: "POST", body }));
  }
  const rep = t.closest("[data-rep]"); if (rep) { rep.disabled = true; return act(api(`/api/replies/${rep.dataset.rep}/action`, { method: "POST", body: { action: rep.dataset.a } })); }
  const dp = t.closest("[data-delprot]"); if (dp) return act(api(`/api/protected/${dp.dataset.delprot}`, { method: "DELETE", body: {} }), "Removed");
  const ds = t.closest("[data-delsupp]"); if (ds) return act(api(`/api/suppressions/${ds.dataset.delsupp}`, { method: "DELETE", body: {} }), "Removed");
  const a = t.closest("[data-act]");
  if (a) {
    switch (a.dataset.act) {
      case "close": ui.drawer = null; return renderDrawer();
      case "runDiscovery": a.disabled = true; a.textContent = "Running…"; return act(api("/api/jobs/discovery", { method: "POST", body: {} }).then((r) => ({ message: r.summary ? `Discovery done: ${r.summary.newEmployers} new employers, ${r.summary.newContacts} new contacts` : "Discovery already running" })));
      case "sendNow": a.disabled = true; return act(api("/api/send/now", { method: "POST", body: {} }).then((r) => ({ message: r.sent ? `${r.dryRun ? "Composed (dry run)" : "Sent"}: ${r.to}` : `Not sent: ${r.reason}` })));
      case "pmScan": {
        const r = await api("/api/jobs/practicematch", { method: "POST", body: {} }).catch((e) => ({ error: e.message }));
        if (r.error) return toast(r.error, true);
        if (r.browser) { location.hash = "settings"; setTimeout(() => document.getElementById("pm-bookmarklet")?.scrollIntoView({ block: "center" }), 600); return toast("The scan runs in your browser: open PracticeMatch and click the MedConnect bookmark.", false); }
        return toast(r.message);
      }
      case "copyStarter": try { await navigator.clipboard.writeText(ui.starter || ""); toast("Scan code copied"); } catch { toast("Couldn't copy. Drag the button to your bookmarks bar instead.", true); } return;
      case "rotateStarter": { const r = await api("/api/collector/rotate", { method: "POST", body: {} }); toast(r.message); return renderAll(); }
      case "pollReplies": return act(api("/api/jobs/replies", { method: "POST", body: {} }).then((r) => ({ message: r.summary.reason || `${r.summary.checked} inbox messages checked, ${r.summary.matched} replies matched` })));
      case "bulk": return act(api("/api/queue/bulk", { method: "POST", body: { action: a.dataset.v } }));
      case "addProtected": return act(api("/api/protected", { method: "POST", body: { text: document.getElementById("prot-add").value } }));
      case "disconnect": return act(api("/api/outlook/disconnect", { method: "POST", body: {} }), "Outlook disconnected");
      case "testEmail": return act(api("/api/outlook/test", { method: "POST", body: {} }));
      case "unblock": return act(api("/api/send/unblock", { method: "POST", body: {} }), "Sending resumed");
      case "resetTpl": { const def = (await api("/api/settings")).defaults.templates[ui.tpl]; await saveSetting({ templates: { [ui.tpl]: def } }); return renderAll(); }
      case "lushaCheck": {
        const out = document.getElementById("lushaOut"); out.hidden = false; out.innerHTML = '<span class="sub">Running a 25-result test search. Nothing is unlocked, so no reveal credits are spent…</span>';
        try {
          const r = await api("/api/lusha/check");
          const n = r.passed ?? r.previews.filter((p) => p.ok === true).length;
          out.innerHTML = `<b>Lusha responded.</b> ${r.previews.length} sample prospects out of ${esc(r.pagination.total ?? "?")} matches for ${esc(r.titlesSearched)} titles, filtered by <b>${esc((r.filters?.used || "").toUpperCase())}</b> codes. <b>${n}</b> pass the provider-employer guard and would be unlocked; the rest are skipped without spending credits.<div class="tablewrap"><table><thead><tr><th>Name</th><th>Title</th><th>Company</th><th>Lusha industry</th><th>Decision</th></tr></thead><tbody>${r.previews.map((p) => `<tr><td>${esc(p.fullName)}</td><td>${esc(p.title)}</td><td>${esc(p.companyName)}<div class="sub mono">${esc(p.companyDomain || "")}</div></td><td>${esc(p.industry || "—")}<div class="sub">${esc(p.type)}</div></td><td><span class="pill ${p.ok ? (p.tier <= 2 ? "p-good" : "p-info") : "p-mute"}">${esc(p.decision)}</span></td></tr>`).join("")}</tbody></table></div><details><summary class="sub" style="cursor:pointer">Raw Lusha result (for troubleshooting)</summary><div class="sub">Company filter sent to Lusha: ${esc(JSON.stringify(r.filters))}</div><pre class="mono" style="white-space:pre-wrap;max-height:300px;overflow:auto">${esc(JSON.stringify(r.rawSample, null, 2))}</pre></details>`;
        } catch (e) { out.innerHTML = `<span class="pill p-bad">Lusha error</span> ${esc(e.message)}`; }
        return;
      }
      case "lushaIndustries": {
        const out = document.getElementById("industryOut"); out.hidden = false; out.innerHTML = '<span class="sub">Asking Lusha for its industry list…</span>';
        try {
          const r = await api("/api/lusha/industries");
          if (!r.values.length) { out.innerHTML = `<span class="pill p-warn">Lusha didn't return an industry list</span><div class="sub">${esc((r.tried || []).join(" · "))}</div>`; return; }
          const s = ui.settingsData.settings.lusha; const chosen = new Set([...(s.mainIndustriesIds || []), ...(s.subIndustriesIds || [])].map(String));
          const health = r.values.filter((v) => /health|hospital|medical|mental|physician|clinic|nursing|care/i.test(v.name + " " + (v.parentName || "")));
          out.innerHTML = `<div class="sub">Pick only hands-on care industries (from ${esc(r.endpoint)}). Leave out device makers, pharma and health IT.</div><div class="checks" style="margin:8px 0">${health.map((v) => `<label><input type="checkbox" data-ind="${esc(v.id)}" data-sub="${v.parentId != null ? 1 : 0}" ${chosen.has(String(v.id)) ? "checked" : ""}>${esc(v.parentName ? v.parentName + " › " : "")}${esc(v.name)} <span class="sub">#${esc(v.id)}</span></label>`).join("")}</div><button class="btn sm primary" data-act="saveIndustries">Use selected industries</button>`;
        } catch (e) { out.innerHTML = `<span class="pill p-bad">Lusha error</span> ${esc(e.message)}`; }
        return;
      }
      case "saveIndustries": {
        const sel = [...document.querySelectorAll("[data-ind]:checked")];
        const main = sel.filter((x) => x.dataset.sub === "0").map((x) => Number(x.dataset.ind));
        const sub = sel.filter((x) => x.dataset.sub === "1").map((x) => Number(x.dataset.ind));
        await saveSetting({ lusha: { mainIndustriesIds: main, subIndustriesIds: sub, industriesLabels: [] } });
        return renderAll();
        return;
      }
    }
  }
  const o = t.closest("[data-open]"); if (o && !t.closest("button")) { ev.preventDefault(); ui.drawer = o.dataset.open; return renderDrawer().catch((e) => toast(e.message, true)); }
});

document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.dataset.task) return act(api(`/api/tasks/${t.dataset.task}/done`, { method: "POST", body: {} }), "Task completed");
  if (t.dataset.pick) {
    const ids = [...document.querySelectorAll("[data-pick]:checked")].map((x) => Number(x.dataset.pick));
    return act(api(`/api/employers/${t.dataset.empId}/action`, { method: "POST", body: { action: "chooseMany", contactIds: ids } }), ids.length ? `${ids.length} contact${ids.length > 1 ? "s" : ""} selected` : "No contacts selected");
  }
  if (t.id === "pmfile" && t.files[0]) {
    const f = t.files[0]; const text = await f.text();
    return act(api("/api/import/practicematch", { method: "POST", body: { text, kind: f.name.endsWith(".json") ? "json" : "csv" } }));
  }
  if (t.dataset.days) {
    const key = t.dataset.days; const vals = [...document.querySelectorAll(`[data-days="${key}"]:checked`)].map((x) => Number(x.value));
    return saveSetting({ [key]: vals });
  }
  if (t.dataset.pmboard) {
    const vals = [...document.querySelectorAll("[data-pmboard]:checked")].map((x) => x.dataset.pmboard);
    return saveSetting({ practicematch: { boards: vals } });
  }
  if (t.dataset.ptier) {
    const vals = [...document.querySelectorAll("[data-ptier]:checked")].map((x) => Number(x.dataset.ptier));
    return saveSetting({ lusha: { prospectTiers: vals.length ? vals : [1] } });
  }
  if (t.dataset.type) {
    const vals = [...document.querySelectorAll("[data-type]:checked")].map((x) => x.dataset.type);
    return saveSetting({ types: vals });
  }
  if (t.dataset.path) {
    let val = t.type === "checkbox" ? t.checked : t.type === "number" ? Number(t.value) : t.value;
    if (t.dataset.kind === "list") val = t.value.split("\n").map((x) => x.trim()).filter(Boolean);
    return saveSetting(setPath({}, t.dataset.path, val));
  }
  if (t.dataset.tplf) {
    const cur = ui.settingsData.settings.templates[ui.tpl];
    return saveSetting({ templates: { [ui.tpl]: { ...cur, [t.dataset.tplf]: t.value } } });
  }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "qsearch") { clearTimeout(saveTimer); saveTimer = setTimeout(renderAll, 350); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && ui.drawer) { ui.drawer = null; renderDrawer(); } });
window.addEventListener("hashchange", () => { renderAll(); window.scrollTo(0, 0); });
setInterval(() => { if (!document.hidden && !ui.drawer && !["settings"].includes(view()) && document.activeElement?.tagName !== "INPUT") renderAll(); }, 60000);
renderAll();
</script>
